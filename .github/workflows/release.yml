name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$version" ]; then
            echo "无法从 app/build.gradle.kts 读取 versionName"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip when this version is already released
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.ver.outputs.tag }}")
          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.ver.outputs.tag }} 已发布，跳过。"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check signing secrets
        if: steps.released.outputs.exists != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          XMS_STORE_PASSWORD: ${{ secrets.XMS_STORE_PASSWORD }}
          XMS_KEY_ALIAS: ${{ secrets.XMS_KEY_ALIAS }}
          XMS_KEY_PASSWORD: ${{ secrets.XMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ANDROID_KEYSTORE_BASE64}" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "${XMS_STORE_PASSWORD}" ] || missing+=("XMS_STORE_PASSWORD")
          [ -n "${XMS_KEY_ALIAS}" ] || missing+=("XMS_KEY_ALIAS")
          [ -n "${XMS_KEY_PASSWORD}" ] || missing+=("XMS_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "缺少 GitHub Actions secrets: ${missing[*]}"
            echo "在仓库 Settings → Secrets and variables → Actions 添加后，重新运行此工作流。"
            exit 1
          fi

      - name: Setup Java
        if: steps.released.outputs.exists != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        if: steps.released.outputs.exists != 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Decode keystore
        if: steps.released.outputs.exists != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > keystore/xmediasaver.jks

      - name: Setup Gradle
        if: steps.released.outputs.exists != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        if: steps.released.outputs.exists != 'true'
        env:
          XMS_STORE_PASSWORD: ${{ secrets.XMS_STORE_PASSWORD }}
          XMS_KEY_ALIAS: ${{ secrets.XMS_KEY_ALIAS }}
          XMS_KEY_PASSWORD: ${{ secrets.XMS_KEY_PASSWORD }}
          XMS_REQUIRE_SIGNING: "true"
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect release files
        if: steps.released.outputs.exists != 'true'
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          src="app/build/outputs/apk/release/app-release.apk"
          mapping="app/build/outputs/mapping/release/mapping.txt"
          test -f "$src"
          test -f "$mapping"
          cp "$src" "XMediaSaver-${version}-release.apk"
          cp "$mapping" "XMediaSaver-${version}-mapping.txt"

      - name: Publish GitHub Release
        if: steps.released.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: XMediaSaver ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            XMediaSaver-${{ steps.ver.outputs.version }}-release.apk
            XMediaSaver-${{ steps.ver.outputs.version }}-mapping.txt
